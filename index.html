<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrea Alberici | UX/UI Designer</title>
<meta name="description" content="Portfolio of Andrea Alberici, UX/UI designer based in Italy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a href="#home" class="logo">Andrea Alberici</a>
    <nav>
      <a href="#home" data-i18n="nav_home"></a>
      <a href="#projects" data-i18n="nav_projects"></a>
      <a href="assets/downloads/Andrea-Alberici-CV.pdf" download data-i18n="nav_cv"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <button class="lang" id="lang" type="button" aria-label="Change language"></button>
  </div>
</header>

<main class="wrap">
  <section id="home" class="hero">
    <div>
      <h1>Andrea<br>Alberici</h1>
      <p class="lead" data-i18n="tagline"></p>
      <a class="btn" href="#projects" data-i18n="cta_projects"></a>
      <a class="btn ghost" href="assets/downloads/Andrea-Alberici-CV.pdf" download data-i18n="cta_cv"></a>
    </div>
    <img class="photo" src="assets/img/about/personal-foto.png" alt="Andrea Alberici">
    <div class="bio">
      <p data-i18n="bio1"></p>
      <p data-i18n="bio2"></p>
    </div>
  </section>

  <section id="projects" class="sec">
    <h2 data-i18n="projects_t"></h2>
    <p class="intro" data-i18n="projects_p"></p>
    <div class="grid" id="grid"></div>
    <h2 class="sub" data-i18n="works_t"></h2>
    <div class="works" id="works"></div>
  </section>

  <section id="contact" class="sec">
    <h2 data-i18n="contact_t"></h2>
    <p class="intro" data-i18n="contact_p"></p>
    <a class="mail" href="mailto:andreaalberici317@gmail.com">andreaalberici317@gmail.com</a>
    <form id="form">
      <label><span data-i18n="f_name"></span><input id="f-name" required autocomplete="name"></label>
      <label><span data-i18n="f_msg"></span><textarea id="f-msg" rows="5" required></textarea></label>
      <button class="btn" type="submit" data-i18n="send"></button>
      <p class="note" data-i18n="reply"></p>
    </form>
    <p class="social">
      <a href="https://github.com/albe2004" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/andrea-alberici-595816347/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.instagram.com/andre.alberici/" target="_blank" rel="noopener">Instagram</a>
    </p>
  </section>
</main>

<footer class="wrap foot"><span id="year"></span> Andrea Alberici. <span data-i18n="rights"></span></footer>
<script src="js/main.js"></script>
</body>
</html>
